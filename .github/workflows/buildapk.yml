name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trova la cartella del progetto
        id: p
        run: echo "dir=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -n 1)")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: ${{ steps.p.outputs.dir }}
      - run: npx cap add android
        working-directory: ${{ steps.p.outputs.dir }}
      - name: Icona pizza
        run: cp -r android-res/. android/app/src/main/res/
        working-directory: ${{ steps.p.outputs.dir }}
      - run: npx cap sync android
        working-directory: ${{ steps.p.outputs.dir }}
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: menu-di-casa-apk
          path: ${{ steps.p.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
